<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <meta name="theme-color" content="#11665f">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Yitian Wang — home">Yitian Wang<span>Materials &amp; energy</span></a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" class="container {% if page.home %}home{% else %}interior{% endif %}" tabindex="-1">
    {% unless page.home %}<header class="page-heading"><p class="eyebrow">Yitian Wang</p><h1>{{ page.title }}</h1>{% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}</header>{% endunless %}
    {{ content }}
  </main>
  <footer class="site-footer container"><span>Yitian Wang · Austin, Texas</span><div><a href="mailto:ywang00149@gmail.com">Email</a><a href="https://www.linkedin.com/in/tim-wang-yitian/">LinkedIn</a><a href="{{ '/documents/' | relative_url }}">Documents</a></div></footer>
</body>
</html>
